openapi: 3.0.0
info:
  title: Ethiopian Orthodox Tewahedo Church CMS API
  description: |
    Production-ready REST API for the Ethiopian Orthodox Tewahedo Church Content Management System.

    ## Authentication
    - **Access token**: short-lived JWT sent via `Authorization: Bearer <token>` header or the `church_access_token` httpOnly cookie.
    - **Refresh token**: long-lived JWT stored in the `church_refresh_token` httpOnly cookie. Rotated on every `/auth/refresh` call.
    - Roles: `Super Admin`, `Admin`, `Priest`, `Secretary`, `Deacon`.

    ## Response format
    Every endpoint returns:
    ```json
    {
      "success": true,
      "message": "string",
      "data": {},
      "errors": [],
      "statusCode": 200
    }
    ```

    ## Pagination
    List endpoints accept `?page=1&limit=20&search=&sortBy=&order=&from=&to=`.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
tags:
  - name: Auth
    description: Authentication & account management
  - name: Users
    description: Admin user management (RBAC)
  - name: Dashboard
    description: Analytics dashboard
  - name: Announcements
    description: Announcement management
  - name: Home
    description: Home page content
  - name: About
    description: About page content
  - name: Leadership
    description: Church leadership
  - name: Sermons
    description: Sermon management
  - name: Events
    description: Events & liturgical calendar
  - name: Sacraments
    description: Sacrament requests
  - name: Gallery
    description: Photo & video albums
  - name: Resources
    description: Downloads and resources
  - name: Membership
    description: Membership applications
  - name: Donations
    description: Donations and receipts
  - name: Contact
    description: Contact inbox & prayer requests
  - name: Settings
    description: Church settings
  - name: Languages
    description: Bilingual translations (English & Amharic)
  - name: Media
    description: File uploads
  - name: Audit Logs
    description: Audit trail
  - name: System
    description: Health checks
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: API is healthy
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new admin (Super Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "Tewodros Gebre"
              email: "tewodros@church.org"
              phone: "+251911000000"
              password: "StrongPass123"
              role: "Admin"
      responses:
        '201':
          description: Admin registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "admin@church.org"
              password: "StrongPass123"
      responses:
        '200':
          description: Login successful. Access & refresh tokens set as httpOnly cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and revoke the refresh token
      responses:
        '200':
          description: Logged out
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if account exists)
  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
        '400':
          description: Invalid or expired token
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
  /auth/verify-email/{token}:
    post:
      tags: [Auth]
      summary: Verify email address
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Verification email sent
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
  /auth/profile:
    patch:
      tags: [Auth]
      summary: Update current profile (name, phone)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated
  /auth/avatar:
    post:
      tags: [Auth]
      summary: Upload profile avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
  /users:
    get:
      tags: [Users]
      summary: List admins (Admin+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Users retrieved
    post:
      tags: [Users]
      summary: Create an admin (Admin+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User retrieved
    patch:
      tags: [Users]
      summary: Update a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [Super Admin, Admin, Priest, Secretary, Deacon]
                isActive:
                  type: boolean
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete a user (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User deleted
  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [Super Admin, Admin, Priest, Secretary, Deacon]
      responses:
        '200':
          description: Role updated
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Status updated
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Full dashboard data (overview + recent + charts)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: months
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Dashboard data
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Analytics overview counts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Overview counts
  /announcements:
    get:
      tags: [Announcements]
      summary: List announcements (public)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Announcements retrieved
    post:
      tags: [Announcements]
      summary: Create announcement (Admin/Priest)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      responses:
        '201':
          description: Announcement created
  /announcements/active:
    get:
      tags: [Announcements]
      summary: List currently active announcements
      responses:
        '200':
          description: Active announcements
  /announcements/{id}:
    get:
      tags: [Announcements]
      summary: Get an announcement
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Announcement retrieved
    patch:
      tags: [Announcements]
      summary: Update an announcement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Announcement updated
    delete:
      tags: [Announcements]
      summary: Delete an announcement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Announcement deleted
  /home:
    get:
      tags: [Home]
      summary: Public home page content (hero, welcome, announcements, live stream, events, sermons, quick links)
      responses:
        '200':
          description: Home content
    patch:
      tags: [Home]
      summary: Update home content (Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home content updated
  /home/admin:
    get:
      tags: [Home]
      summary: Get admin home settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin home content
  /sermons:
    get:
      tags: [Sermons]
      summary: List sermons (public, published only via /sermons/public)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Sermons retrieved
    post:
      tags: [Sermons]
      summary: Create sermon (Admin/Priest) with optional thumbnail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sermon'
      responses:
        '201':
          description: Sermon created
  /sermons/public:
    get:
      tags: [Sermons]
      summary: List published sermons
      responses:
        '200':
          description: Published sermons
  /sermons/featured:
    get:
      tags: [Sermons]
      summary: List featured sermons
      responses:
        '200':
          description: Featured sermons
  /sermons/recent:
    get:
      tags: [Sermons]
      summary: List recent sermons
      responses:
        '200':
          description: Recent sermons
  /sermons/categories:
    get:
      tags: [Sermons]
      summary: Get sermon category counts
      responses:
        '200':
          description: Categories
  /sermons/{id}:
    get:
      tags: [Sermons]
      summary: Get a sermon
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sermon retrieved
    patch:
      tags: [Sermons]
      summary: Update a sermon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sermon updated
    delete:
      tags: [Sermons]
      summary: Delete a sermon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sermon deleted
  /sermons/{id}/audio:
    post:
      tags: [Sermons]
      summary: Upload sermon audio
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Audio uploaded
  /sermons/{id}/video:
    post:
      tags: [Sermons]
      summary: Upload sermon video
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Video uploaded
  /sermons/{id}/thumbnail:
    post:
      tags: [Sermons]
      summary: Upload sermon thumbnail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Thumbnail uploaded
  /sermons/{id}/download:
    post:
      tags: [Sermons]
      summary: Record a sermon download
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Download recorded
  /events:
    get:
      tags: [Events]
      summary: List events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Events retrieved
    post:
      tags: [Events]
      summary: Create event (Admin/Priest/Deacon)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created
  /events/upcoming:
    get:
      tags: [Events]
      summary: List upcoming events
      responses:
        '200':
          description: Upcoming events
  /events/past:
    get:
      tags: [Events]
      summary: List past events
      responses:
        '200':
          description: Past events
  /events/featured:
    get:
      tags: [Events]
      summary: List featured events
      responses:
        '200':
          description: Featured events
  /events/calendar:
    get:
      tags: [Events]
      summary: Month calendar
      parameters:
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: month
          schema:
            type: integer
            description: 1-12
      responses:
        '200':
          description: Calendar events
  /events/liturgical-calendar:
    get:
      tags: [Events]
      summary: Full year liturgical calendar
      parameters:
        - in: query
          name: year
          schema:
            type: integer
      responses:
        '200':
          description: Liturgical calendar
  /events/{id}:
    get:
      tags: [Events]
      summary: Get an event with RSVP count
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Event retrieved
    patch:
      tags: [Events]
      summary: Update an event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Event updated
    delete:
      tags: [Events]
      summary: Delete an event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Event deleted
  /events/{id}/rsvp:
    post:
      tags: [Events]
      summary: RSVP to an event (public)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RsvpRequest'
      responses:
        '201':
          description: RSVP recorded
  /events/{id}/rsvps:
    get:
      tags: [Events]
      summary: List event RSVPs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: RSVPs retrieved
  /sacraments:
    get:
      tags: [Sacraments]
      summary: List sacrament requests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Requests retrieved
    post:
      tags: [Sacraments]
      summary: Submit a sacrament request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SacramentRequest'
      responses:
        '201':
          description: Request submitted
  /sacraments/{id}/status:
    patch:
      tags: [Sacraments]
      summary: Update request status / assign priest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Status updated
  /gallery:
    get:
      tags: [Gallery]
      summary: List albums
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Albums retrieved
    post:
      tags: [Gallery]
      summary: Create album (Admin/Deacon)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GalleryAlbum'
      responses:
        '201':
          description: Album created
  /gallery/{id}:
    get:
      tags: [Gallery]
      summary: Get album with images/videos
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Album retrieved
    patch:
      tags: [Gallery]
      summary: Update album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Album updated
    delete:
      tags: [Gallery]
      summary: Delete album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Album deleted
  /gallery/{id}/images:
    post:
      tags: [Gallery]
      summary: Upload multiple images to album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Images uploaded
  /gallery/{id}/videos:
    post:
      tags: [Gallery]
      summary: Upload video to album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Video uploaded
  /gallery/{id}/images/{mediaId}:
    delete:
      tags: [Gallery]
      summary: Remove an image from album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image removed
  /gallery/{id}/videos/{mediaId}:
    delete:
      tags: [Gallery]
      summary: Remove a video from album
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video removed
  /resources:
    get:
      tags: [Resources]
      summary: List resources
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Resources retrieved
    post:
      tags: [Resources]
      summary: Create resource (Admin/Deacon)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Resource created
  /resources/categories:
    get:
      tags: [Resources]
      summary: Resource category counts
      responses:
        '200':
          description: Categories
  /resources/{id}/download:
    post:
      tags: [Resources]
      summary: Record a download
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Download recorded
  /resources/{id}/pdf:
    post:
      tags: [Resources]
      summary: Upload resource PDF
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF uploaded
  /membership:
    get:
      tags: [Membership]
      summary: List membership applications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Members retrieved
    post:
      tags: [Membership]
      summary: Register a member (public, with optional documents)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Membership'
      responses:
        '201':
          description: Membership submitted
  /membership/{id}:
    get:
      tags: [Membership]
      summary: Get a member
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Member retrieved
    patch:
      tags: [Membership]
      summary: Update a member
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Member updated
    delete:
      tags: [Membership]
      summary: Delete a member
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
