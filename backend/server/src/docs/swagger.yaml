components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: MongoDB ObjectId
    Page:
      in: query
      name: page
      schema:
        type: integer
        default: 1
      description: Page number
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        default: 20
      description: Items per page
    Search:
      in: query
      name: search
      schema:
        type: string
      description: Keyword search
    SortBy:
      in: query
      name: sortBy
      schema:
        type: string
      description: Sort field
    Order:
      in: query
      name: order
      schema:
        type: string
        enum: [asc, desc]
      description: Sort order
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          nullable: true
        statusCode:
          type: integer
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        statusCode:
          type: integer
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [Super Admin, Admin, Priest, Secretary, Deacon]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ResetPasswordRequest:
      type: object
      required: [password, confirmPassword]
      properties:
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
        confirmNewPassword:
          type: string
    MediaObject:
      type: object
      properties:
        url:
          type: string
        publicId:
          type: string
        resourceType:
          type: string
          enum: [image, video, raw]
        format:
          type: string
        size:
          type: number
        width:
          type: number
        height:
          type: number
    Announcement:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        titleAm: { type: string }
        description: { type: string }
        descriptionAm: { type: string }
        priority:
          type: string
          enum: [Low, Normal, High, Critical]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isPublished:
          type: boolean
    Sermon:
      type: object
      required: [title]
      properties:
        title: { type: string }
        titleAm: { type: string }
        description: { type: string }
        descriptionAm: { type: string }
        speaker: { type: string }
        scripture: { type: string }
        category:
          type: string
          enum: [Sunday Sermon, Bible Study, Homily, Lent, Feast, Teaching, Other]
        language:
          type: string
          enum: [English, Amharic, Both, Other]
        thumbnail:
          type: string
          format: binary
        duration:
          type: number
        publishedAt:
          type: string
          format: date-time
        isPublished:
          type: boolean
        isFeatured:
          type: boolean
    Event:
      type: object
      required: [title, date]
      properties:
        title: { type: string }
        titleAm: { type: string }
        description: { type: string }
        descriptionAm: { type: string }
        date:
          type: string
          format: date-time
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string }
        category:
          type: string
          enum: [Liturgy, Fasting, Feast, Wedding, Baptism, Seminar, Conference, Youth, Charity, Other]
        coverImage:
          type: string
          format: binary
        capacity:
          type: number
        isFeatured:
          type: boolean
        status:
          type: string
          enum: [upcoming, ongoing, completed, cancelled]
    RsvpRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        guests:
          type: number
          maximum: 10
        status:
          type: string
          enum: [confirmed, pending, cancelled]
    SacramentRequest:
      type: object
      required: [type, memberName]
      properties:
        type:
          type: string
          enum: [Baptism, Holy Communion, Confession, Matrimony, Anointing of the Sick, Ordination, House Blessing, Other]
        member:
          type: string
        memberName: { type: string }
        phone: { type: string }
        email: { type: string }
        preferredDate:
          type: string
          format: date
        assignedPriest:
          type: string
        status:
          type: string
          enum: [pending, scheduled, confirmed, completed, cancelled, rejected]
        notes: { type: string }
    GalleryAlbum:
      type: object
      required: [albumName]
      properties:
        albumName: { type: string }
        albumNameAm: { type: string }
        description: { type: string }
        descriptionAm: { type: string }
        coverImage:
          type: string
          format: binary
        category:
          type: string
          enum: [Liturgy, Festival, Ordination, Baptism, Community, Conference, Other]
    Resource:
      type: object
      required: [title]
      properties:
        title: { type: string }
        titleAm: { type: string }
        description: { type: string }
        descriptionAm: { type: string }
        category:
          type: string
          enum: [Books, Prayers, Hymns, Scriptures, Liturgy, Music, Other]
        language:
          type: string
          enum: [English, Amharic, Both, Other]
        thumbnail:
          type: string
          format: binary
        pdf:
          type: string
          format: binary
        isPublished:
          type: boolean
    Membership:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string }
        amharicName: { type: string }
        baptismName: { type: string }
        email: { type: string }
        phone: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            subcity: { type: string }
            woreda: { type: string }
            country: { type: string }
        family:
          type: array
          items:
            type: object
            properties:
              fullName: { type: string }
              relationship: { type: string }
              age: { type: number }
        documents:
          type: array
          items:
            type: string
            format: binary
        status:
          type: string
          enum: [pending, approved, rejected, inactive]
        notes: { type: string }
    Donation:
      type: object
      required: [amount]
      properties:
        donorName: { type: string }
        email: { type: string }
        phone: { type: string }
        amount:
          type: number
          minimum: 1
        currency:
          type: string
          default: ETB
        campaign: { type: string }
        paymentMethod:
          type: string
          enum: [stripe, telebirr, cbe-birr, cash, bank-transfer, other]
        isAnonymous:
          type: boolean
    ContactMessage:
      type: object
      required: [name, email, message]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        subject: { type: string }
        message: { type: string }
        category:
          type: string
          enum: [General, Prayer Request, Membership, Donation, Event, Bible Question, Support, Other]
    PrayerRequest:
      type: object
      required: [request]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        prayerType: { type: string }
        request: { type: string }
        isConfidential:
          type: boolean
        isPublic:
          type: boolean
    Setting:
      type: object
      properties:
        churchName: { type: string }
        churchNameAm: { type: string }
        tagline: { type: string }
        taglineAm: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            region: { type: string }
            country: { type: string }
            postalCode: { type: string }
        phone: { type: string }
        email: { type: string }
        socialLinks:
          type: object
          properties:
            facebook: { type: string }
            twitter: { type: string }
            instagram: { type: string }
            youtube: { type: string }
            telegram: { type: string }
            tiktok: { type: string }
        liveStreamURL: { type: string }
        heroImage:
          type: string
          format: binary
        logo:
          type: string
          format: binary
        favicon:
          type: string
          format: binary
        footerText: { type: string }
        footerTextAm: { type: string }
        languageSettings:
          type: object
          properties:
            defaultLanguage:
              type: string
              enum: [english, amharic]
            supportedLanguages:
              type: array
              items:
                type: string
                enum: [english, amharic]
            allowLanguageSwitch:
              type: boolean
        theme:
          type: object
          properties:
            primaryColor: { type: string }
            secondaryColor: { type: string }
            fontFamily: { type: string }
            darkMode: { type: boolean }
