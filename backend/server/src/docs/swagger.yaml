        '200':
          description: Member deleted
  /membership/{id}/approve:
    patch:
      tags: [Membership]
      summary: Approve a member
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Member approved
  /membership/{id}/reject:
    patch:
      tags: [Membership]
      summary: Reject a member
      security:
